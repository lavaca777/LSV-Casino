version: "3.8"

services:
  db:
    image: postgres:13
    container_name: casino_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: casino
      POSTGRES_PASSWORD: casino_dev_password
      POSTGRES_DB: casino_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino -d casino_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
