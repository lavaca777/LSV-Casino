name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend - tests y coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: casino
          POSTGRES_PASSWORD: casino_dev_password
          POSTGRES_DB: casino_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casino -d casino_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://casino:casino_dev_password@localhost:5432/casino_db
      SECRET_KEY: ci_test_secret_key

    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Correr tests con coverage
        run: python -m pytest tests -v --cov=app --cov-report=term-missing --cov-fail-under=60

  backend-docker:
    name: Backend - build de la imagen Docker
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t casino-backend ./Backend

  frontend:
    name: Frontend - lint y build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000